<svg viewBox="0 0 680 400" width="100%" role="img">
  <title>CoalChat retrieval and QA pipeline architecture</title>
  <desc>CoalChat hybrid retrieval: BGE+FAISS dense + BM25 sparse, RRF fusion, BGE Reranker re-ranking, LLM generation with citations</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="16" width="600" height="368" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="40" text-anchor="middle" font-size="15" font-weight="500" fill="#27500A">CoalChat Retrieval &amp; QA Pipeline</text>
  <rect x="60" y="54" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="120" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Vue Frontend</text>
  <text x="120" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">:5173</text>
  <rect x="200" y="54" width="120" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="260" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">Express</text>
  <text x="260" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">NLP :3000</text>
  <rect x="340" y="54" width="280" height="44" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="480" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">FastAPI Knowledge Service</text>
  <text x="480" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">:8000 (SSE)</text>
  <line x1="180" y1="76" x2="200" y2="76" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="76" x2="340" y2="76" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="116" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="205" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">BGE Embedding</text>
  <text x="205" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3C3489">Dense recall via FAISS</text>
  <rect x="350" y="116" width="250" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="475" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">BM25</text>
  <text x="475" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#712B13">Sparse recall via keyword</text>
  <text x="340" y="108" text-anchor="middle" font-size="11" fill="#5F5E5A">Dual-path parallel recall</text>
  <line x1="480" y1="98" x2="205" y2="116" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="98" x2="475" y2="116" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="130" y="190" width="420" height="48" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">RRF Fusion</text>
  <text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">Reciprocal Rank Fusion — dense + sparse merge</text>
  <line x1="205" y1="172" x2="340" y2="190" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="172" x2="340" y2="190" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="130" y="258" width="420" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">BGE Reranker</text>
  <text x="340" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">Cross-encoder re-ranking + threshold filtering</text>
  <line x1="340" y1="238" x2="340" y2="258" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="326" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="348" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">LLM Generation</text>
  <text x="180" y="366" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3C3489">[#n] citations + evidence lookback</text>
  <rect x="300" y="326" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="360" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">Redis</text>
  <text x="360" y="366" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">Cache + Persist</text>
  <rect x="440" y="326" width="160" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="520" y="348" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#791F1F">Degradation</text>
  <text x="520" y="366" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">No evidence → Refusal</text>
  <line x1="340" y1="306" x2="180" y2="326" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="306" x2="360" y2="326" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="306" x2="520" y2="326" stroke="#A32D2D" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
